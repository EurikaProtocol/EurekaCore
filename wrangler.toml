name = "eurekacore-v3"
main = "./cloudflare/worker.js"
compatibility_date = "2026-09-17"
workers_dev = false

routes = [
  { pattern = "www.tinaneureka.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API requests always reach the Worker, never an asset or the SPA fallback.
run_worker_first = ["/api/*"]

# D1 (durable task/approval state) is intentionally NOT bound: it needs a real database_id from the owner.
# See docs/PERSISTENCE.md. This is the ONLY deploy config; all scripts pin it with --config.
# Which Worker name is live on Cloudflare is unverified (see docs/SINGLE_WRANGLER_CONFIG.md).
