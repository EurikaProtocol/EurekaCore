name: Cloudflare deployment

# Pull requests to main: verify only (no secrets, no deploy).
# Push to main (or a manual run of main): verify, then deploy Worker eurekacore-v3 from wrangler.toml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build, routing regression tests, unit/integration tests, then the dry run pinned to wrangler.toml (npm run deploy:check).
      - run: npm run verify
      - name: Dependency audit (fails on new high/critical advisories)
        run: node scripts/audit-check.mjs

  deploy:
    name: deploy (production, eurekacore-v3)
    needs: verify
    # Only the main branch may deploy; PRs, other branches and forks never reach this job.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One production deployment at a time; a newer run waits instead of cancelling one that is mid-deploy.
    concurrency:
      group: production-deploy-eurekacore-v3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Cloudflare credentials (names only, values are never printed)
        run: node scripts/check-deploy-env.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # `npm run deploy` does not build, so build the exact commit being deployed.
      - run: npm run build
      - name: Deploy Worker eurekacore-v3
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
